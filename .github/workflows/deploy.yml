name: Deploy Next.js with Custom Config

on:
  push:
    branches: ["main"] # Runs every time you push to the main branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # CRITICAL: Point Next.js to your specific config file
      - name: Build Next.js with Custom Config
        env:
          NEXT_CONFIG_SRC: ./next.config.prod.js
        run: |
          # Alternative safety step: overwrite default config if Next_CONFIG_SRC isn't honored by your version
          cp ./next.config.prod.js ./next.config.js
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Next.js static export generates files into the 'out' directory
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
